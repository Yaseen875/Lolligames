<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lolligames</title>
    <link rel="icon" href="images/Red icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Chewy&display=swap" rel="stylesheet">
    
</head>
<body>
    <div class="home">
        <h1 class="title">Lolligames</h1>
        <div class="iconlist"><img src="images/White icon.png" alt="White icon" class="icon">
        <ul class="dropdown">
            <li>Games</li>
            <li>Settings</li>
            <li>Tournaments</li>
        </ul>
        </div>
        <h2 class="bored">Bored?</h2><br>
        <h2 class="lets">Let's</h2>
        <span class="play-span"></span><p class="play">Play</p>
        <p class="description">Games for physical parties of any number of players!</p>
    </div>
    <div class="scrollable">
        <img src="images/clouds3.png" alt="Clouds" class="clouds">
        <h2 class="about">Features :</h2>
        <div class="features">
            <h3 class="feature1">Different game modes for physical parties</h3>
            <h3 class="feature2">Team 1 vs. Team 2 type shi</h3>
            <h3 class="feature3">Showdown games</h3>
            <h3 class="feature4">x number of fun games</h3>
        </div>
        <div class="images">
            <img src="images/eg.png" alt="image1" class="image1">
            <img src="images/eg.png" alt="image2" class="image2">
            <img src="images/eg.png" alt="image3" class="image3">
            <img src="images/eg.png" alt="image4" class="image4">
        </div>
    </div>
</body>
</html>
